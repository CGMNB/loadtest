name: loadtest
on:
  workflow_dispatch:
    inputs:
      url:
        description: '目标网址（默认你的站）'
        required: false
        default: 'https://hualuopd.com/'
      concurrency:
        description: '并发数（默认1000，越大越猛）'
        required: false
        default: '1000'
      duration:
        description: '时长（秒，默认60）'
        required: false
        default: '60'
      processes:
        description: '进程数（默认2）'
        required: false
        default: '2'
      method:
        description: '请求方法 GET/POST（默认GET）'
        required: false
        default: 'GET'
      data:
        description: 'POST请求体（选POST时才填）'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 装依赖
        run: pip install aiohttp brotli requests tqdm
      - name: 下载压测脚本
        run: |
          wget -q -O 1.py "https://aka.doubaocdn.com/s/958cs631f1" || curl -sL -o 1.py "https://aka.doubaocdn.com/s/958cs631f1"
          test -s 1.py && echo "脚本下载成功: $(wc -l < 1.py) 行"
      - name: 开跑
        env:
          URL: ${{ github.event.inputs.url }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          DURATION: ${{ github.event.inputs.duration }}
          PROCESSES: ${{ github.event.inputs.processes }}
          METHOD: ${{ github.event.inputs.method }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          ARGS="--url '$URL' -a -p $PROCESSES -c $CONCURRENCY --duration $DURATION -y --browser"
          if [ "$METHOD" != "GET" ]; then
            ARGS="$ARGS --method $METHOD"
            if [ -n "$DATA" ]; then ARGS="$ARGS --data '$DATA'"; fi
          fi
          echo "执行: python3 1.py $ARGS"
          python3 1.py $ARGS
